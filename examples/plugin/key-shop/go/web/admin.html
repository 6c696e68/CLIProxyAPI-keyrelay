<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Keys</title>
<style>
:root {
  --bg-secondary: #faf9f5; --bg-primary: #f0eee8; --bg-tertiary: #e9e6df;
  --text-primary: #2d2a26; --text-secondary: #6d6760; --text-tertiary: #a29c95;
  --border-color: #e3e1db; --border-hover: #cecac4;
  --primary-color: #8b8680; --primary-hover: #7f7a74; --primary-contrast: #fff;
  --error-color: #c65746;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg-secondary: #151412; --bg-primary: #1d1b18; --bg-tertiary: #262320;
  --text-primary: #f6f4f1; --text-secondary: #c9c3bb; --text-tertiary: #9c958d;
  --border-color: #3a3530; --border-hover: #5a544d; --primary-hover: #9a948e;
  --shadow: 0 1px 3px rgb(0 0 0 / 0.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font); }
main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 56px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; }
h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.4px; }
.desc { margin: 6px 0 0; color: var(--text-secondary); font-size: 14px; }
.card {
  display: flex; flex-direction: column; gap: 16px; padding: 22px 24px;
  border: 1px solid var(--border-color); border-radius: 14px;
  background: color-mix(in srgb, var(--bg-primary) 82%, transparent);
}
.card-head { display: flex; gap: 10px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
.index {
  display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 28px;
  border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-secondary);
  font-family: var(--mono); font-size: 11px; font-weight: 650; letter-spacing: 0.08em;
}
h2 { margin: 0; font-size: 16px; font-weight: 700; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input {
  min-width: 140px; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px;
  background: var(--bg-secondary); color: var(--text-primary); font: inherit;
}
input:focus { outline: none; border-color: var(--border-hover); }
button {
  display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent;
  border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer;
}
.primary { background: var(--primary-color); border-color: var(--primary-color); color: var(--primary-contrast); }
.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.secondary { background: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary); }
.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.danger { background: var(--error-color); border-color: var(--error-color); color: #fff; }
.table-wrap { border: 1px solid var(--border-color); border-radius: 8px; overflow: auto; background: var(--bg-primary); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th { background: var(--bg-tertiary); color: var(--text-secondary); font-size: 12px; font-weight: 500; text-align: left; padding: 10px 14px; }
td { padding: 12px 14px; border-top: 1px solid var(--border-color); vertical-align: middle; }
tr:hover td { background: color-mix(in srgb, var(--bg-tertiary) 50%, transparent); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.secret { font-family: var(--mono); color: var(--error-color); min-height: 1.4em; }
.check { color: var(--text-secondary); font-size: 14px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>
  <header class="page-head">
    <div>
      <h1>API Keys</h1>
      <p class="desc">Tạo key để bán. Mặc định 7 ngày và 100.000.000 token. Secret chỉ hiện một lần.</p>
    </div>
    <div class="row" id="mgmt-row">
      <input id="mgmt" type="password" placeholder="Mật khẩu đăng nhập management" autocomplete="current-password">
      <button id="save" class="secondary" type="button">Dùng key này</button>
    </div>
  </header>
  <section class="card">
    <div class="card-head"><span class="index">01</span><h2>Tạo key</h2></div>
    <div class="row">
      <input id="label" placeholder="label">
      <input id="customer" placeholder="customer">
      <input id="ttl" type="number" value="604800" title="giây">
      <input id="limit" type="number" value="100000000">
      <label class="check"><input id="never" type="checkbox"> Không hết hạn</label>
      <label class="check"><input id="unlimited" type="checkbox"> Không giới hạn token</label>
      <button id="create" class="primary" type="button">Tạo</button>
    </div>
    <p id="once" class="secret"></p>
  </section>
  <section class="card">
    <div class="card-head"><span class="index">02</span><h2>Danh sách</h2></div>
    <div class="table-wrap">
      <table><thead><tr><th>Tên</th><th>Key</th><th>Status</th><th>Used</th><th>Limit</th><th>Expires</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
  <section class="card">
    <div class="card-head"><span class="index">03</span><h2>Sửa hạn</h2></div>
    <div class="row">
      <input id="edit-id" placeholder="id">
      <input id="edit-ttl" type="number" placeholder="ttl seconds">
      <input id="edit-limit" type="number" placeholder="token limit">
      <button id="save-edit" class="primary" type="button">Lưu</button>
      <button id="enable" class="secondary" type="button">Bật</button>
    </div>
  </section>
  <section class="card">
    <div class="card-head"><span class="index">04</span><h2>Request</h2></div>
    <div class="row"><input id="req-id" placeholder="key id"><button id="load-req" class="secondary" type="button">Xem</button></div>
    <div class="table-wrap">
      <table><thead><tr><th>Thời gian</th><th>Model</th><th>Status</th><th>Token</th></tr></thead><tbody id="reqs"></tbody></table>
    </div>
  </section>
</main>
<script>
(function syncTheme() {
  const apply = (theme) => { if (theme) document.documentElement.dataset.theme = theme; };
  try { apply(parent.document.documentElement.dataset.theme); } catch (e) {}
  if (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches) apply("dark");
})();
const ENC_PREFIX = "enc::v1::";
function deobfuscate(payload) {
  if (!payload || !payload.startsWith(ENC_PREFIX)) return payload;
  const binary = atob(payload.slice(ENC_PREFIX.length));
  const encrypted = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) encrypted[i] = binary.charCodeAt(i);
  const keyBytes = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + "|" + navigator.userAgent);
  const out = new Uint8Array(encrypted.length);
  for (let i = 0; i < encrypted.length; i++) out[i] = encrypted[i] ^ keyBytes[i % keyBytes.length];
  return new TextDecoder().decode(out);
}
function panelKey() {
  const stores = [localStorage];
  try { if (parent && parent.localStorage) stores.push(parent.localStorage); } catch (e) {}
  for (const store of stores) {
    for (const name of ["cli-proxy-auth", "managementKey"]) {
      try {
        const raw = store.getItem(name);
        if (!raw) continue;
        const parsed = JSON.parse(deobfuscate(raw));
        const state = parsed && parsed.state ? parsed.state : parsed;
        const key = state && (state.managementKey || state);
        if (typeof key === "string" && key.trim()) return key.trim();
      } catch (e) {}
    }
  }
  return "";
}
function typedKey() {
  return document.getElementById("mgmt").value.trim().replace(/^Bearer\s+/i, "");
}
let activeKey = panelKey() || sessionStorage.getItem("keyshop.mgmt") || "";
const mgmt = document.getElementById("mgmt");
if (panelKey()) document.getElementById("mgmt-row").hidden = true;
else mgmt.value = activeKey;
document.getElementById("save").onclick = () => {
  activeKey = typedKey();
  sessionStorage.setItem("keyshop.mgmt", activeKey);
  load();
};
async function api(method, path, body) {
  const key = panelKey() || activeKey || typedKey();
  const res = await fetch(path, {method, headers:{"Authorization":"Bearer " + key, "Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = {error: text || res.statusText}; }
  if (res.status === 401) {
    sessionStorage.removeItem("keyshop.mgmt");
    activeKey = "";
    document.getElementById("mgmt-row").hidden = false;
    data.error = data.error || "Sai mật khẩu management. Dùng mật khẩu đăng nhập panel, không dùng API key khách.";
  }
  return data;
}
function idOf(key) { return key.ID || key.id; }
async function load() {
  const data = await api("GET", "/v0/management/plugins/key-shop/keys");
  const keys = data.keys || [];
  document.getElementById("rows").innerHTML = keys.map((key) => `<tr><td>${key.Label || key.label || "—"}</td><td class="mono">${key.Display || key.display}</td><td>${key.Status || key.status}</td><td class="mono">${key.TokensUsed || 0}</td><td class="mono">${key.TokenLimit || 0}</td><td>${key.ExpiresAt || key.expires_at || "never"}</td><td>
    <button class="ghost" data-id="${idOf(key)}" data-act="disable">Tắt</button>
    <button class="ghost" data-id="${idOf(key)}" data-act="reset">Reset</button>
    <button class="ghost" data-id="${idOf(key)}" data-act="rotate">Rotate</button>
    <button class="danger" data-id="${idOf(key)}" data-act="delete">Xóa</button>
    <button class="ghost" data-id="${idOf(key)}" data-act="logs">Log</button>
  </td></tr>`).join("") || "<tr><td colspan='7'>Chưa có key.</td></tr>";
}
document.getElementById("create").onclick = async () => {
  const data = await api("POST", "/v0/management/plugins/key-shop/keys", {
    label: document.getElementById("label").value,
    customer: document.getElementById("customer").value,
    ttl_seconds: Number(document.getElementById("ttl").value),
    token_limit: Number(document.getElementById("limit").value),
    never_expires: document.getElementById("never").checked,
    unlimited_tokens: document.getElementById("unlimited").checked
  });
  document.getElementById("once").textContent = data.secret ? "Copy once: " + data.secret : (data.error || "create failed");
  await load();
};
async function logs(id) {
  document.getElementById("req-id").value = id;
  const data = await api("GET", "/v0/management/plugins/key-shop/requests?id=" + encodeURIComponent(id) + "&limit=30");
  const rows = data.requests || [];
  document.getElementById("reqs").innerHTML = rows.map((row) => `<tr><td>${row.RequestedAt || ""}</td><td>${row.Model || ""}</td><td>${row.Status || ""}</td><td class="mono">${row.Billed || 0}</td></tr>`).join("") || "<tr><td colspan='4'>Chưa có request.</td></tr>";
}
document.getElementById("rows").onclick = async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.act === "disable") await api("POST", "/v0/management/plugins/key-shop/keys/update", {id, status: "disabled"});
  if (btn.dataset.act === "reset") await api("POST", "/v0/management/plugins/key-shop/keys/reset-usage", {id});
  if (btn.dataset.act === "delete") await api("POST", "/v0/management/plugins/key-shop/keys/delete", {id});
  if (btn.dataset.act === "rotate") {
    const data = await api("POST", "/v0/management/plugins/key-shop/keys/rotate", {id});
    document.getElementById("once").textContent = data.secret ? "Copy once: " + data.secret : "rotate failed";
  }
  if (btn.dataset.act === "logs") { await logs(id); return; }
  await load();
};
document.getElementById("save-edit").onclick = async () => {
  const body = {id: document.getElementById("edit-id").value};
  const ttl = document.getElementById("edit-ttl").value;
  const limit = document.getElementById("edit-limit").value;
  if (ttl !== "") body.ttl_seconds = Number(ttl);
  if (limit !== "") body.token_limit = Number(limit);
  await api("POST", "/v0/management/plugins/key-shop/keys/update", body);
  await load();
};
document.getElementById("enable").onclick = async () => {
  await api("POST", "/v0/management/plugins/key-shop/keys/update", {id: document.getElementById("edit-id").value, status: "active"});
  await load();
};
document.getElementById("load-req").onclick = () => logs(document.getElementById("req-id").value);
if (mgmt.value) load();
</script>
</body>
</html>
